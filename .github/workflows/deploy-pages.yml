name: Guarded Pages promotion draft
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Verified immutable bundle workflow run
        required: true
        type: string
      publication_run_id:
        description: Publication UUID
        required: true
        type: string
      manifest_sha256:
        description: Expected manifest SHA-256
        required: true
        type: string
      receipt_sha256:
        description: Expected receipt SHA-256
        required: true
        type: string
      provenance_sha256:
        description: Expected provenance SHA-256
        required: true
        type: string
      previous_release_id:
        description: Expected production release UUID or NONE
        required: true
        type: string
      previous_provenance_sha256:
        description: Expected production provenance SHA-256 or NONE
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ivmova-production-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: immutable-release-bundle
          path: release-bundle
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify bundle chain
        env:
          EXPECTED_RUN: ${{ inputs.publication_run_id }}
          EXPECTED_MANIFEST: ${{ inputs.manifest_sha256 }}
          EXPECTED_RECEIPT: ${{ inputs.receipt_sha256 }}
          EXPECTED_PROVENANCE: ${{ inputs.provenance_sha256 }}
        run: node scripts/publication-promotion-check.mjs release-bundle
      - name: Fail closed until durable production authority is implemented
        run: node scripts/publication-release.mjs production-gate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release-bundle/public
  deploy:
    needs: validate
    # Deliberate second interlock. Remove only after authority/reconciliation review.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
