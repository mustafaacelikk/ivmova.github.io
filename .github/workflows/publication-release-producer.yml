name: Reviewed release bundle producer
on:
  workflow_dispatch:
    inputs:
      publication_run:
        description: Reviewed FULL publication input UUID on main
        type: string
        required: true
      manifest_sha256:
        description: Reviewed input manifest SHA-256
        type: string
        required: true
      attest:
        description: Generate official attestation if plan supports it
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production build from reviewed input and complete bundle
        env:
          PUBLICATION_RUN: ${{ inputs.publication_run }}
          EXPECTED_MANIFEST: ${{ inputs.manifest_sha256 }}
        run: node scripts/publication-release-producer.mjs
      - uses: actions/upload-artifact@v4
        id: bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle.tar
          if-no-files-found: error
          retention-days: 90
  attest:
    needs: build
    if: ${{ inputs.attest && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attest
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/attest/bundle.tar
# Optional unsupported attestation fails; GITHUB_ATTESTATION never silently downgrades.
